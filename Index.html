<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">O</div><div><div class="brand-name">ozlind</div><div class="brand-tag">AI workspace</div></div></div>
  <button class="new-chat" id="newChat"><span class="plus">＋</span> New chat <span style="margin-left:auto;color:var(--muted);font-size:10px">⌘ K</span></button>
  <div class="nav-label">Workspace</div>
  <nav class="nav-list" aria-label="Main navigation">
    <button class="nav-item active" data-page="chat"><span class="ico">◫</span> Chat</button>
    <button class="nav-item" data-page="settings"><span class="ico">⚙</span> Settings</button>
    <button class="nav-item" data-page="terms"><span class="ico">▤</span> Terms &amp; conditions</button>
  </nav>
  <div class="nav-label">Recent chats</div><div class="history" id="history"><div style="padding:8px 10px;color:var(--muted);font-size:11px">Your conversations will appear here.</div></div>
  <div class="sidebar-bottom"><button class="nav-item" data-page="settings"><span class="ico">☻</span> Account &amp; preferences</button><div class="profile"><div class="avatar">O</div><div><div class="profile-name">Ozlind user</div><div class="profile-sub">Personal workspace</div></div></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><button class="model-switch" id="modelSwitch" type="button" aria-label="Ozlind model"><span class="model-indicator"></span><span>Ozlind</span><span class="model-chevron">⌄</span></button><span class="page-context" id="pageTitle">New chat</span></div><div class="top-actions"><span class="top-note">A clearer way to think and create</span><button class="icon-btn" id="shareBtn" aria-label="Share conversation" title="Share conversation">↗</button><button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◐</button></div></header>
<div class="content" id="content"></div>
<footer class="footer"><span>© 2026 Ozlind. All rights reserved.</span><span><a href="#" data-link="terms">Terms &amp; conditions</a> · <a href="#" data-link="settings">Settings</a></span></footer>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), content=$('#content'), sidebar=$('#sidebar');
let page='chat',messages=[],conversations=[],activeId=0;
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)};
function setPage(next){page=next;$('#pageTitle').textContent=next==='chat'?(activeId?(conversations.find(c=>c.id===activeId)?.title.slice(0,36)||'Chat'):'New chat'):next==='settings'?'Settings':'Terms & conditions';document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===next));sidebar.classList.remove('open');$('#sidebarBackdrop').classList.remove('show');render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(page==='chat')renderChat();else if(page==='settings')renderSettings();else renderTerms()}
function renderChat(){content.innerHTML='<section class="chat-page"><div class="messages" id="messages"></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Ask anything..." aria-label="Message Ozlind"></textarea><div class="composer-tools"><div class="tool-left"><button class="tool-btn" id="attachBtn" title="File uploads are not connected yet" aria-label="Attach a file">＋ Attach</button><button class="tool-btn" id="webBtn" title="Web search is not connected yet" aria-label="Web search">◎ Web search</button><button class="tool-btn think-btn" id="thinkBtn" type="button" aria-pressed="false">✧ Think</button></div><div class="tool-right"><span style="font-size:10px;color:var(--muted)" id="sendHint">Enter to send</span><button class="send-btn" id="sendBtn" aria-label="Send message" disabled>↑</button></div></div></div><p class="disclaimer">AI responses are not connected yet. Avoid entering sensitive information.</p></div></section>';
const area=$('#messages');if(!messages.length){const showSuggestions=localStorage.getItem('ozlind-suggestions')!=='0';area.innerHTML='<div class="welcome"><div class="welcome-mark">O</div><h1>What can I help you with?</h1><p>A thoughtful workspace for questions, ideas and the work ahead.</p>'+(showSuggestions?'<div class="suggestions"><button class="suggestion" data-prompt="Explain a complex topic in simple terms"><strong>✳ Learn something</strong>Make a difficult topic easier to understand.</button><button class="suggestion" data-prompt="Help me draft and improve a piece of writing"><strong>✎ Write with clarity</strong>Draft, edit or explore a new idea.</button><button class="suggestion" data-prompt="Help me plan a project step by step"><strong>⌁ Plan a project</strong>Turn a goal into practical next steps.</button><button class="suggestion" data-prompt="Review this code and suggest improvements"><strong>⌘ Work with code</strong>Review, understand and improve code.</button></div>':'')+'</div>'}else{messages.forEach(m=>{const el=document.createElement('div');el.className='message '+m.role;el.innerHTML='<div class="message-avatar">'+(m.role==='user'?'U':'O')+'</div><div class="bubble">'+escapeHtml(m.text)+'</div>';area.appendChild(el)});area.scrollTop=area.scrollHeight}
const input=$('#prompt'),send=$('#sendBtn'),enterToSend=localStorage.getItem('ozlind-enter-send')!=='0';$('#sendHint').textContent=enterToSend?'Enter to send':'Ctrl + Enter to send';input.addEventListener('input',()=>{send.disabled=!input.value.trim();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&(enterToSend||e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage()}});send.addEventListener('click',sendMessage);document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.dispatchEvent(new Event('input'));input.focus()}));$('#attachBtn').addEventListener('click',()=>toast('File uploads are not connected yet.'));$('#webBtn').addEventListener('click',()=>toast('Live web search is not connected yet.'))}
function sendMessage(){const input=$('#prompt');if(!input||!input.value.trim())return;const text=input.value.trim();messages.push({role:'user',text});if(!activeId){activeId=Date.now();conversations.unshift({id:activeId,title:text.slice(0,42),messages:messages.slice()})}else{const current=conversations.find(c=>c.id===activeId);if(current)current.messages=messages.slice()}renderHistory();$('#pageTitle').textContent=text.slice(0,36);renderChat();toast('Message saved in this session. AI replies are not connected yet.')}
function renderHistory(){const h=$('#history');h.innerHTML='';if(!conversations.length){h.innerHTML='<div class="empty-history">Your recent chats will show up here.</div>';return}conversations.slice(0,12).forEach(c=>{const b=document.createElement('button');b.className='history-item';b.textContent='◦ '+c.title;b.title=c.title;b.setAttribute('aria-label','Open chat: '+c.title);b.addEventListener('click',()=>{activeId=c.id;messages=c.messages.slice();setPage('chat');$('#pageTitle').textContent=c.title.slice(0,36)});h.appendChild(b)})}
function renderSettings(){content.innerHTML='<section class="subpage"><h1>Settings</h1><p class="lead">Make Ozlind feel right for the way you work.</p><div class="settings-section"><h2>Appearance</h2><p class="section-desc">Choose how Ozlind looks on this device.</p><div class="setting-row"><div><div class="setting-title">Theme</div><div class="setting-help">Switch between pure white and pure black backgrounds.</div></div><select class="select" id="themeSelect"><option value="light">Light</option><option value="dark">Dark</option></select></div></div><div class="settings-section"><h2>Chat preferences</h2><p class="section-desc">Control your conversation experience.</p><div class="setting-row"><div><div class="setting-title">Enter to send</div><div class="setting-help">Press Enter to send; Shift + Enter for a new line.</div></div><input type="checkbox" class="toggle" id="enterToggle" checked></div><div class="setting-row"><div><div class="setting-title">Show prompt suggestions</div><div class="setting-help">Display helpful starting points on a new chat.</div></div><input type="checkbox" class="toggle" id="suggestToggle" checked></div></div><div class="settings-section"><h2>Privacy &amp; data</h2><p class="section-desc">This early interface keeps chat state in this browser session only. Account sync and server-side data controls are not connected.</p><div class="setting-row"><div><div class="setting-title">Clear current conversation</div><div class="setting-help">Remove messages from the open chat.</div></div><button class="secondary-btn" id="clearChat">Clear chat</button></div></div><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="primary-btn" id="saveSettings">Save preferences</button></div></section>';
$('#themeSelect').value=document.documentElement.dataset.theme||'light';$('#enterToggle').checked=localStorage.getItem('ozlind-enter-send')!=='0';$('#suggestToggle').checked=localStorage.getItem('ozlind-suggestions')!=='0';$('#themeSelect').addEventListener('change',e=>applyTheme(e.target.value));$('#saveSettings').addEventListener('click',()=>{localStorage.setItem('ozlind-enter-send',$('#enterToggle').checked?'1':'0');localStorage.setItem('ozlind-suggestions',$('#suggestToggle').checked?'1':'0');toast('Preferences saved on this device.')});$('#clearChat').addEventListener('click',()=>{messages=[];activeId=0;setPage('chat');toast('Current conversation cleared.')})}
function renderTerms(){content.innerHTML='<section class="subpage"><h1>Terms &amp; conditions</h1><p class="lead">Please read these terms before using the Ozlind interface.</p><div class="notice">This is a preliminary product terms page for the early Ozlind interface, not a substitute for legally reviewed terms. It must be reviewed and completed by the service operator before public launch.</div><article class="terms-card"><h2>1. Acceptance of terms</h2><p>By accessing or using Ozlind, you agree to comply with the terms and policies that apply to the service. If you do not agree, please do not use the service.</p></article><article class="terms-card"><h2>2. The service</h2><p>Ozlind is being developed as an AI workspace. Features may change, be added, or be temporarily unavailable as the platform evolves. The interface currently shown is an early frontend build; AI responses, accounts, uploads and cloud synchronisation are not yet connected.</p></article><article class="terms-card"><h2>3. Acceptable use</h2><p>You agree not to misuse the service, interfere with its operation, attempt unauthorised access, or use it in ways that violate applicable laws or the rights of others.</p></article><article class="terms-card"><h2>4. AI-generated content</h2><p>AI-generated information may be inaccurate, incomplete or outdated. You are responsible for reviewing outputs and verifying important information before relying on it. Do not treat generated content as professional legal, medical, financial or other regulated advice.</p></article><article class="terms-card"><h2>5. Privacy and data</h2><p>Data handling, retention, security, analytics and account controls must be described in a separate Privacy Policy before public launch. Do not submit sensitive personal information to an early or unverified build.</p></article><article class="terms-card"><h2>6. Availability and changes</h2><p>The service is provided during development on an evolving basis. We may modify, suspend or discontinue features. No uptime or uninterrupted availability is promised by this preliminary page.</p></article><article class="terms-card"><h2>7. Contact and governing law</h2><p>Official operator details, a support contact, governing law and dispute-resolution terms must be added and legally reviewed before these terms are published as binding terms.</p></article><p class="terms-date">Draft interface text · Last updated: 27 November 2026</p></section>'}
function applyTheme(theme){document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#000000':'#ffffff';localStorage.setItem('ozlind-theme',theme);const s=$('#themeSelect');if(s)s.value=theme}
$('#modelSwitch').addEventListener('click',()=>toast('Ozlind model settings — connect model routing to enable selection.'));$('#shareBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);toast('Page link copied.')}catch{toast('Use your browser share option to share Ozlind.')}});$('#thinkBtn').addEventListener('click',e=>{const b=e.currentTarget;const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.textContent=on?'✧ Think on':'✧ Think';toast(on?'Thinking mode selected.':'Standard mode selected.')});$('#newChat').addEventListener('click',()=>{messages=[];activeId=0;setPage('chat')});document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.querySelectorAll('[data-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();setPage(a.dataset.link)}));$('#themeBtn').addEventListener('click',()=>applyTheme((document.documentElement.dataset.theme||'light')==='light'?'dark':'light'));$('#menuBtn').addEventListener('click',()=>{sidebar.classList.toggle('open');$('#sidebarBackdrop').classList.toggle('show',sidebar.classList.contains('open'))});$('#sidebarBackdrop').addEventListener('click',()=>{sidebar.classList.remove('open');$('#sidebarBackdrop').classList.remove('show')});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#newChat').click()}if(e.key==='Escape')sidebar.classList.remove('open')});applyTheme(localStorage.getItem('ozlind-theme')||'light');renderHistory();render();
</script>
</body></html>
