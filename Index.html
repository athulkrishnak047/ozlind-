<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Ozlind is a focused AI workspace for thinking, writing and creating.">
<title>Ozlind — Your AI workspace</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none;text-rendering:optimizeLegibility;--bg:#fff;--panel:#fff;--surface:#fff;--text:#171717;--muted:#737373;--line:#e8e8e8;--soft:#f5f5f5;--accent:#5b4bd8;--accent-soft:#f1efff;--sidebar:250px;--content:880px;--r-sm:9px;--r-md:13px;--r-lg:17px}
[data-theme=dark]{color-scheme:dark;--bg:#000;--panel:#000;--surface:#090909;--text:#f4f4f4;--muted:#a3a3a3;--line:#292929;--soft:#141414;--accent:#b5a8ff;--accent-soft:#211d35}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{display:flex;min-height:100vh;min-height:100dvh}.sidebar{position:sticky;top:0;display:flex;flex:0 0 var(--sidebar);flex-direction:column;width:var(--sidebar);height:100vh;height:100dvh;padding:20px 14px 14px;background:var(--panel);border-right:1px solid var(--line);overflow:hidden}.brand{padding:4px 10px 24px}.brand-name{font-size:21px;font-weight:760;letter-spacing:-.9px}.brand-tag{margin-top:2px;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.new-chat{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:13px;font-weight:620;text-align:left}.new-chat:hover,.nav-item:hover,.history-item:hover{background:var(--soft)}.plus{color:var(--accent);font-size:20px;line-height:1}
.nav-label{padding:24px 10px 8px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.nav-list{display:grid;gap:3px}.nav-item,.history-item{display:flex;align-items:center;gap:11px;width:100%;min-height:39px;padding:9px 11px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:13px;text-align:left}.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:650}.ico{display:block;width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.history{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.history-item{min-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.history-item[aria-current=true]{background:var(--soft);color:var(--text)}.empty-history{padding:8px 10px;color:var(--muted);font-size:11px;line-height:1.6}.sidebar-bottom{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line)}.sidebar-footnote{margin:0;color:var(--muted);font-size:10px;line-height:1.55}
.main{display:flex;flex:1;flex-direction:column;min-width:0;min-height:100vh;min-height:100dvh;background:var(--bg)}.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:0 clamp(14px,3vw,28px);border-bottom:1px solid var(--line);background:var(--bg)}.top-left,.top-actions{display:flex;align-items:center;gap:10px}.page-title{font-size:14px;font-weight:650}.icon-btn{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--text)}.icon-btn:hover{background:var(--soft)}.mobile-menu{display:none}
.content{display:flex;flex:1;flex-direction:column;min-height:0}.chat-page{display:flex;flex:1;flex-direction:column;width:min(100%,var(--content));min-height:0;margin:0 auto;padding:clamp(22px,5vh,46px) clamp(14px,3vw,28px) 18px}.messages{display:flex;flex:1;flex-direction:column;gap:24px;min-height:0;padding:8px 0 22px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.welcome{width:100%;max-width:620px;margin:auto auto 28px;text-align:center}.welcome h1{margin:0 0 10px;font-size:clamp(28px,4.2vw,41px);font-weight:730;letter-spacing:-1.8px;line-height:1.13}.welcome p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px;text-align:left}.suggestion{min-height:82px;padding:14px 15px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:12px;line-height:1.55;text-align:left;transition:background-color .15s,border-color .15s}.suggestion:hover{border-color:var(--accent);background:var(--accent-soft)}.suggestion strong{display:block;margin-bottom:4px;font-size:13px;font-weight:650}
.message{display:flex;align-items:flex-start;gap:12px;max-width:100%}.message.user{flex-direction:row-reverse}.message-label{flex:0 0 54px;padding-top:4px;color:var(--muted);font-size:11px;font-weight:650}.message.user .message-label{text-align:right}.bubble{max-width:min(720px,calc(100% - 66px));font-size:14px;line-height:1.78;white-space:pre-wrap;overflow-wrap:anywhere}.message.user .bubble{padding:10px 14px;border-radius:14px;background:var(--soft)}.message.assistant .bubble{padding:2px 0}.message-actions{display:flex;gap:5px;margin:5px 0 0}.message-action{padding:4px 7px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:10px}.message-action:hover{background:var(--soft);color:var(--text)}
.composer-wrap{width:100%;max-width:790px;margin:0 auto;padding-top:12px}.composer{padding:11px 12px 9px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);transition:border-color .15s}.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,var(--line))}.composer textarea{display:block;width:100%;min-height:36px;max-height:190px;padding:4px 4px 9px;border:0;outline:0!important;resize:none;background:transparent;color:var(--text);font-size:14px;line-height:1.6}.composer textarea::placeholder{color:var(--muted)}.composer-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}.composer-hint{color:var(--muted);font-size:10px}.send-btn{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:var(--text);color:var(--bg)}.send-btn .ico{width:18px;height:18px}.disclaimer{margin:9px 6px 0;color:var(--muted);font-size:10px;line-height:1.5;text-align:center}.notice{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:12px;line-height:1.6}
.subpage{width:min(100%,790px);margin:0 auto;padding:clamp(28px,5vh,48px) clamp(16px,3vw,30px) 64px}.subpage h1{margin:0 0 8px;font-size:clamp(27px,4vw,34px);font-weight:720;letter-spacing:-1.2px;line-height:1.2}.lead{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.7}.settings-section,.terms-card{margin:12px 0;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}.settings-section h2,.terms-card h2{margin:0 0 5px;font-size:14px;font-weight:680}.section-desc{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.6}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line)}.setting-row:first-of-type{border-top:0}.setting-title{font-size:13px;font-weight:620}.setting-help{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.55}.select{min-width:112px;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);color:var(--text);font-size:12px}.toggle{appearance:none;position:relative;width:42px;height:24px;flex:0 0 auto;border-radius:99px;background:var(--line);cursor:pointer;transition:background .15s}.toggle:checked{background:var(--accent)}.toggle:after{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:white;content:"";transition:transform .15s}.toggle:checked:after{transform:translateX(18px)}.button-row{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.primary-btn,.secondary-btn{min-height:39px;padding:9px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:650}.primary-btn{border:0;background:var(--text);color:var(--bg)}.secondary-btn{border:1px solid var(--line);background:var(--surface);color:var(--text)}.primary-btn:hover,.secondary-btn:hover{opacity:.82}.terms-card{padding:19px 20px}.terms-card p,.terms-card li{color:var(--muted);font-size:13px;line-height:1.8}.terms-card ul{padding-left:20px}.terms-date{margin-top:20px;color:var(--muted);font-size:11px}.footer{display:flex;justify-content:space-between;gap:12px;padding:14px clamp(14px,3vw,28px);border-top:1px solid var(--line);color:var(--muted);font-size:10px}.footer a{color:inherit;text-decoration:none}.footer a:hover{color:var(--accent)}.toast{position:fixed;bottom:22px;left:50%;z-index:30;max-width:calc(100vw - 28px);padding:10px 15px;transform:translate(-50%,12px);border-radius:10px;background:var(--text);color:var(--bg);font-size:12px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}.toast.show{transform:translate(-50%,0);opacity:1}.skip-link{position:fixed;top:8px;left:8px;z-index:50;padding:9px 12px;transform:translateY(-150%);border-radius:8px;background:var(--text);color:var(--bg)}.skip-link:focus{transform:translateY(0)}.backdrop{display:none}
@media(max-width:760px){.sidebar{position:fixed;z-index:15;top:0;bottom:0;left:0;width:min(290px,86vw);height:100dvh;transform:translateX(-105%);transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.backdrop.show{position:fixed;z-index:14;inset:0;display:block;background:rgba(0,0,0,.4)}.mobile-menu{display:grid}.topbar{min-height:56px}.chat-page{padding:20px 14px 12px}.welcome{margin:24px auto}.welcome h1{font-size:clamp(27px,8vw,35px)}.suggestions{grid-template-columns:1fr;margin-top:21px}.suggestion{min-height:0}.composer-wrap{padding-top:9px}.subpage{padding:27px 15px 46px}.settings-section,.terms-card{padding:16px}.footer{padding:12px 14px}.top-note{display:none}}
@media(max-width:420px){.footer{flex-direction:column;gap:6px}.message{gap:8px}.message-label{flex-basis:42px}.bubble{max-width:calc(100% - 50px)}.setting-row{align-items:flex-start}.button-row{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="Ozlind workspace navigation">
  <div class="brand"><div class="brand-name">Ozlind</div><div class="brand-tag">AI workspace</div></div>
  <button class="new-chat" id="newChat" type="button"><span class="plus" aria-hidden="true">+</span> New chat</button>
  <div class="nav-label">Workspace</div>
  <nav class="nav-list" aria-label="Main navigation">
    <button class="nav-item active" data-page="chat" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-chat"/></svg> Chat</button>
    <button class="nav-item" data-page="settings"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg> Settings</button>

  </nav>

</aside>
<main class="main">
<header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" id="menuBtn" type="button" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button><span class="page-title" id="pageTitle">New chat</span></div><div class="top-actions"><button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"><svg class="ico" id="themeIcon" aria-hidden="true"><use href="#i-moon"/></svg></button></div></header>
<div class="content" id="content" tabindex="-1"></div>
<footer class="footer"><span>© 2026 Ozlind. All rights reserved.</span><span><a href="#" data-link="terms">Terms &amp; conditions</a> · <a href="#" data-link="settings">Settings</a></span></footer>
</main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),content=$('#content'),sidebar=$('#sidebar');
const KEYS={theme:'ozlind-theme',enter:'ozlind-enter-send',suggest:'ozlind-suggestions',session:'ozlind-session-v1'};
let page='chat',messages=[],conversations=[],activeId=0,toastTimer;
function readSetting(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:v}catch{return fallback}}
function writeSetting(key,value){try{localStorage.setItem(key,value);return true}catch{return false}}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function persist(){try{sessionStorage.setItem(KEYS.session,JSON.stringify({conversations:conversations.slice(0,30),activeId,messages}))}catch{toast('Session storage is unavailable in this browser.')}}
function restore(){try{const saved=JSON.parse(sessionStorage.getItem(KEYS.session)||'null');if(!saved||!Array.isArray(saved.conversations))return;conversations=saved.conversations.filter(c=>c&&Number.isFinite(Number(c.id))&&typeof c.title==='string'&&Array.isArray(c.messages)).slice(0,30);activeId=Number(saved.activeId)||0;const current=conversations.find(c=>Number(c.id)===activeId);messages=current?current.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.text==='string'):[]}catch{conversations=[];messages=[];activeId=0}}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(next){page=next;const titles={chat:activeId?(conversations.find(c=>Number(c.id)===activeId)?.title.slice(0,36)||'Chat'):'New chat',settings:'Settings',terms:'Terms & conditions'};$('#pageTitle').textContent=titles[next]||'Ozlind';document.querySelectorAll('.nav-item[data-page]').forEach(button=>{const active=button.dataset.page===next;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});closeSidebar();render()}
function closeSidebar(){sidebar.classList.remove('open');$('#backdrop').classList.remove('show');$('#menuBtn').setAttribute('aria-expanded','false')}
function render(){if(page==='chat')renderChat();else if(page==='settings')renderSettings();else renderTerms()}
function renderChat(){content.innerHTML='<section class="chat-page"><div class="messages" id="messages" role="log" aria-label="Conversation messages" aria-live="polite" aria-relevant="additions"></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" maxlength="12000" placeholder="Message Ozlind..." aria-label="Message Ozlind" aria-describedby="composerHint"></textarea><div class="composer-tools"><span class="composer-hint" id="composerHint">Shift + Enter for a new line</span><button class="send-btn" id="sendBtn" type="button" aria-label="Send message" disabled><svg class="ico" aria-hidden="true"><use href="#i-up"/></svg></button></div></div><p class="disclaimer">AI responses are not connected yet. Your conversations stay in this browser session.</p></div></section>';
const area=$('#messages');
if(!messages.length){const show=readSetting(KEYS.suggest,'1')!=='0';area.innerHTML='<div class="welcome"><h1>What can I help you with?</h1><p>Ask a question or describe what you want to work on.</p>'+(show?'<div class="suggestions"><button class="suggestion" data-prompt="Explain a complex topic in simple terms"><strong>Learn something</strong>Make a difficult topic easier to understand.</button><button class="suggestion" data-prompt="Help me draft and improve a piece of writing"><strong>Write with clarity</strong>Draft, edit or explore a new idea.</button><button class="suggestion" data-prompt="Help me plan a project step by step"><strong>Plan a project</strong>Turn a goal into practical next steps.</button><button class="suggestion" data-prompt="Review this code and suggest improvements"><strong>Work with code</strong>Review, understand and improve code.</button></div>':'')+'</div>'}
else{messages.forEach((message,index)=>{const item=document.createElement('article');item.className='message '+message.role;const label=message.role==='user'?'You':'Ozlind';item.innerHTML='<div class="message-label">'+label+'</div><div><div class="bubble">'+escapeHtml(message.text)+'</div><div class="message-actions"><button class="message-action" type="button" data-copy="'+index+'">Copy</button>'+(message.role==='user'?'<button class="message-action" type="button" data-edit="'+index+'">Edit</button>':'')+'</div></div>';area.appendChild(item)});area.scrollTop=area.scrollHeight}
const input=$('#prompt'),send=$('#sendBtn'),enter=readSetting(KEYS.enter,'1')!=='0';$('#composerHint').textContent=enter?'Enter to send · Shift + Enter for a new line':'Ctrl + Enter to send · Shift + Enter for a new line';
input.addEventListener('input',()=>{send.disabled=!input.value.trim();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px'});
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&(enter||event.ctrlKey||event.metaKey)){event.preventDefault();sendMessage()}});
send.addEventListener('click',sendMessage);
document.querySelectorAll('[data-prompt]').forEach(button=>button.addEventListener('click',()=>{input.value=button.dataset.prompt;input.dispatchEvent(new Event('input'));input.focus()}));
document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',()=>copyMessage(Number(button.dataset.copy))));
document.querySelectorAll('[data-edit]').forEach(button=>button.addEventListener('click',()=>editMessage(Number(button.dataset.edit))));
}
function sendMessage(){const input=$('#prompt');if(!input||!input.value.trim())return;const text=input.value.trim();messages.push({role:'user',text});if(!activeId){activeId=Date.now();conversations.unshift({id:activeId,title:text.slice(0,48),messages:messages.slice()})}else{const current=conversations.find(c=>Number(c.id)===activeId);if(current){current.messages=messages.slice();current.title=current.title||text.slice(0,48)}}conversations=conversations.slice(0,30);persist();renderHistory();setPage('chat')}
async function copyMessage(index){const text=messages[index]?.text;if(typeof text!=='string')return;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text)}else{const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw new Error('Copy unavailable')}toast('Message copied.')}catch{toast('Could not copy this message on this device.')}}
function editMessage(index){const message=messages[index];if(!message||message.role!=='user')return;const text=message.text;messages=messages.slice(0,index);const current=conversations.find(c=>Number(c.id)===activeId);if(current)current.messages=messages.slice();persist();renderChat();const input=$('#prompt');input.value=text;input.dispatchEvent(new Event('input'));input.focus();toast('You can edit and resend your message.')}
function renderHistory(){const history=$('#history');history.innerHTML='';if(!conversations.length){history.innerHTML='<div class="empty-history">Your recent chats will appear here.</div>';return}conversations.slice(0,15).forEach(conversation=>{const button=document.createElement('button');button.className='history-item';button.textContent=conversation.title;button.title=conversation.title;button.setAttribute('aria-current',String(Number(conversation.id)===activeId));button.addEventListener('click',()=>{activeId=Number(conversation.id);messages=conversation.messages.slice();persist();setPage('chat')});history.appendChild(button)})}
function applyTheme(theme){theme=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#000000':'#ffffff';writeSetting(KEYS.theme,theme);const label=theme==='dark'?'Switch to light theme':'Switch to dark theme';$('#themeBtn').setAttribute('aria-label',label);$('#themeBtn').title=label;$('#themeIcon').innerHTML='<use href="#i-'+(theme==='dark'?'sun':'moon')+'"/>';const select=$('#themeSelect');if(select)select.value=theme}
function renderSettings(){content.innerHTML='<section class="subpage"><h1>Settings</h1><p class="lead">Make Ozlind feel right for the way you work.</p><div class="settings-section"><h2>Appearance</h2><p class="section-desc">Choose how Ozlind looks on this device.</p><div class="setting-row"><div><div class="setting-title">Theme</div><div class="setting-help">Pure white in light mode and pure black in dark mode.</div></div><select class="select" id="themeSelect" aria-label="Choose theme"><option value="light">Light</option><option value="dark">Dark</option></select></div></div><div class="settings-section"><h2>Chat preferences</h2><p class="section-desc">Set the behaviour of the message composer.</p><div class="setting-row"><div><div class="setting-title">Enter to send</div><div class="setting-help">Press Enter to send; Shift + Enter inserts a new line.</div></div><input type="checkbox" class="toggle" id="enterToggle" aria-label="Enter to send"></div><div class="setting-row"><div><div class="setting-title">Prompt suggestions</div><div class="setting-help">Show helpful starting points on a new chat.</div></div><input type="checkbox" class="toggle" id="suggestToggle" aria-label="Show prompt suggestions"></div></div><div class="settings-section"><h2>Privacy &amp; data</h2><p class="section-desc">Conversations are stored in this browser tab session only. They are not synced to an account or server.</p><div class="setting-row"><div><div class="setting-title">Clear current conversation</div><div class="setting-help">Remove the open conversation from this session.</div></div><button class="secondary-btn" id="clearChat" type="button">Clear chat</button></div><div class="setting-row"><div><div class="setting-title">Clear all session chats</div><div class="setting-help">Remove every conversation stored in this tab session.</div></div><button class="secondary-btn" id="clearAll" type="button">Clear all</button></div></div><div class="button-row"><button class="primary-btn" id="saveSettings" type="button">Save preferences</button></div></section>';
$('#themeSelect').value=document.documentElement.dataset.theme||'light';$('#enterToggle').checked=readSetting(KEYS.enter,'1')!=='0';$('#suggestToggle').checked=readSetting(KEYS.suggest,'1')!=='0';$('#themeSelect').addEventListener('change',event=>applyTheme(event.target.value));$('#saveSettings').addEventListener('click',()=>{const ok1=writeSetting(KEYS.enter,$('#enterToggle').checked?'1':'0'),ok2=writeSetting(KEYS.suggest,$('#suggestToggle').checked?'1':'0');toast(ok1&&ok2?'Preferences saved on this device.':'Some preferences could not be saved.')});$('#clearChat').addEventListener('click',()=>{if(!activeId){toast('There is no open conversation to clear.');return}conversations=conversations.filter(c=>Number(c.id)!==activeId);messages=[];activeId=0;persist();renderHistory();setPage('chat');toast('Current conversation cleared.')});$('#clearAll').addEventListener('click',()=>{conversations=[];messages=[];activeId=0;persist();renderHistory();setPage('chat');toast('All session conversations cleared.')})}
function renderTerms(){content.innerHTML='<section class="subpage"><h1>Terms &amp; conditions</h1><p class="lead">Please read these preliminary terms before using the Ozlind interface.</p><div class="notice">This is draft product text for an early interface, not legally reviewed terms. It must be completed and reviewed by the service operator before public launch.</div><article class="terms-card"><h2>1. Acceptance of terms</h2><p>By accessing or using Ozlind, you agree to comply with the terms and policies that apply to the service. If you do not agree, please do not use the service.</p></article><article class="terms-card"><h2>2. The service</h2><p>Ozlind is being developed as an AI workspace. Features may change, be added, or be temporarily unavailable as the platform evolves. The current build is an early frontend; AI responses, accounts, uploads and cloud synchronisation are not connected.</p></article><article class="terms-card"><h2>3. Acceptable use</h2><p>You agree not to misuse the service, interfere with its operation, attempt unauthorised access, or use it in ways that violate applicable laws or the rights of others.</p></article><article class="terms-card"><h2>4. AI-generated content</h2><p>AI-generated information may be inaccurate, incomplete or outdated. Review outputs and verify important information before relying on it. Do not treat generated content as professional legal, medical, financial or other regulated advice.</p></article><article class="terms-card"><h2>5. Privacy and data</h2><p>Data handling, retention, security, analytics and account controls must be described in a separate Privacy Policy before public launch. Do not submit sensitive personal information to an early or unverified build.</p></article><article class="terms-card"><h2>6. Availability and changes</h2><p>The service is provided during development on an evolving basis. Features may be modified, suspended or discontinued. This preliminary page does not promise uptime or uninterrupted availability.</p></article><article class="terms-card"><h2>7. Contact and governing law</h2><p>Official operator details, a support contact, governing law and dispute-resolution terms must be added and legally reviewed before these terms are published as binding terms.</p></article><p class="terms-date">Draft interface text · Last updated: 28 November 2026</p></section>'}
$('#newChat').addEventListener('click',()=>{messages=[];activeId=0;persist();setPage('chat')});
document.querySelectorAll('.nav-item[data-page]').forEach(button=>button.addEventListener('click',()=>setPage(button.dataset.page)));
document.querySelectorAll('[data-link]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();setPage(link.dataset.link)}));
$('#themeBtn').addEventListener('click',()=>applyTheme((document.documentElement.dataset.theme||'light')==='light'?'dark':'light'));
$('#menuBtn').addEventListener('click',()=>{const open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);$('#backdrop').classList.toggle('show',open);$('#menuBtn').setAttribute('aria-expanded',String(open))});
$('#backdrop').addEventListener('click',closeSidebar);
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('#newChat').click()}if(event.key==='Escape')closeSidebar()});
applyTheme(readSetting(KEYS.theme,'light'));restore();renderHistory();render();
</script>
</body>
