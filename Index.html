/* Ozlind UI system: semantic tokens, responsive layout, accessible states */
:root{color-scheme:light;--bg:#fff;--panel:#fff;--surface:#fff;--text:#171717;--muted:#666;--line:#e7e7e7;--soft:#f5f5f5;--accent:#5948d6;--accent-soft:#f1efff;--shadow:none;--radius-sm:9px;--radius-md:13px;--radius-lg:17px;--content-width:920px;--sidebar-width:252px}
[data-theme="dark"]{color-scheme:dark;--bg:#000;--panel:#000;--surface:#090909;--text:#f4f4f4;--muted:#b0b0b0;--line:#292929;--soft:#141414;--accent:#b4a6ff;--accent-soft:#211d35;--shadow:none}
html{scroll-behavior:smooth;scroll-padding-top:76px}body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}.app{min-height:100vh;min-height:100dvh}
.sidebar{width:var(--sidebar-width);flex-basis:var(--sidebar-width);padding:22px 15px 16px;background:var(--panel);border-color:var(--line)}
.brand{padding:4px 10px 24px;gap:0}.brand-name{font-size:20px;font-weight:760;letter-spacing:-.8px}.brand-tag{font-size:10px;letter-spacing:1.2px;margin-top:3px}
.new-chat{border-radius:var(--radius-md);box-shadow:none;padding:11px 13px}.nav-label{padding:24px 10px 8px;letter-spacing:1px}.nav-list{gap:4px}
.nav-item,.history-item{min-height:40px;border-radius:var(--radius-sm);font-size:13px}.nav-item{gap:12px}.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.ico{width:18px;height:18px;flex:0 0 18px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.history{overscroll-behavior:contain;scrollbar-width:thin}.history-item{padding:9px 11px}.empty-history{padding:8px 10px;color:var(--muted);font-size:11px;line-height:1.6}
.sidebar-bottom{border:0;padding:0}.sidebar-footnote{margin:0;padding:12px 10px 2px;color:var(--muted);font-size:10px;line-height:1.5}
.main{background:var(--bg);min-height:100vh;min-height:100dvh}.topbar{position:sticky;top:0;z-index:5;height:62px;min-height:62px;padding:0 clamp(15px,3vw,30px);background:var(--bg);border-color:var(--line)}
.page-title{font-size:14px;font-weight:680}.icon-btn{width:38px;height:38px;border-radius:11px;border-color:transparent;background:transparent}.icon-btn:hover{background:var(--soft)}#themeBtn .ico{width:18px;height:18px}.mobile-menu{display:none}
.content{min-height:0}.chat-page{container-type:inline-size;container-name:chat;width:min(100%,var(--content-width));padding:clamp(22px,4vh,42px) clamp(14px,3vw,30px) 18px}
.welcome{max-width:620px;margin:auto auto 30px}.welcome h1{font-size:clamp(28px,4.5vw,42px);line-height:1.12;letter-spacing:-1.7px;font-weight:720;margin-bottom:12px}.welcome p{font-size:14px;line-height:1.7}
.suggestions{gap:10px;margin-top:28px}.suggestion{min-height:88px;padding:15px 16px;border:1px solid var(--line);border-radius:var(--radius-md);font-size:12px;line-height:1.55;transition:background-color .16s,border-color .16s}.suggestion strong{font-size:13px;font-weight:660;margin-bottom:4px}.suggestion:hover{border-color:var(--accent);background:var(--accent-soft)}
.messages{gap:25px;padding:8px 0 24px;overscroll-behavior:contain;scrollbar-width:thin}.message{gap:13px}.message-label{flex:0 0 58px;padding-top:3px;color:var(--muted);font-size:11px;font-weight:650}
.bubble{max-width:min(720px,calc(100% - 70px));font-size:14px;line-height:1.78}.message.user .bubble{background:var(--soft);padding:11px 15px;border-radius:14px}.message.assistant .bubble{padding:2px 0}
.composer-wrap{width:100%;max-width:800px;margin:0 auto;padding-top:12px}.composer{border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px 13px 10px;box-shadow:none;transition:border-color .15s}.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 65%,var(--line))}
.composer textarea{min-height:34px;max-height:200px;font-size:14px;line-height:1.6;padding:4px 4px 9px}.composer-tools{min-height:36px}.tool-btn{min-height:34px}.send-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}.send-btn .ico{width:18px;height:18px}.disclaimer{font-size:10px;line-height:1.5;margin:10px 8px 0}
.subpage{width:min(100%,780px);padding:clamp(28px,5vh,48px) clamp(16px,3vw,30px) 64px}.subpage h1{font-size:clamp(27px,4vw,34px);line-height:1.15;letter-spacing:-1.2px}.subpage .lead{line-height:1.7;margin-bottom:26px}
.settings-section{border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;margin:12px 0;background:var(--surface)}.settings-section h2,.terms-card h2{font-size:14px;font-weight:680}.setting-row{gap:16px;padding:14px 0}.setting-help,.section-desc{line-height:1.6}
.select,.text-field{max-width:min(190px,45%);border-radius:var(--radius-sm);min-height:38px}.toggle{width:42px;height:24px}.toggle:after{width:18px;height:18px}.toggle:checked:after{left:21px}
.primary-btn,.secondary-btn{min-height:39px;padding:10px 15px;border-radius:var(--radius-sm)}.terms-card{border:1px solid var(--line);border-radius:var(--radius-lg);padding:19px 20px;margin:12px 0}.terms-card p,.terms-card li{font-size:13px;line-height:1.8}
.footer{padding:15px clamp(15px,3vw,30px);background:var(--bg);border-color:var(--line);font-size:10px}.toast{max-width:calc(100vw - 28px);text-align:center;line-height:1.5}
.sidebar-backdrop{display:none}.skip-link{position:fixed;top:8px;left:8px;z-index:50;transform:translateY(-150%);padding:10px 14px;border-radius:8px;background:var(--text);color:var(--bg);font-weight:650}.skip-link:focus{transform:translateY(0)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:not-allowed}
@container chat (max-width:560px){.suggestions{grid-template-columns:1fr}.suggestion{min-height:0}.message-label{flex-basis:46px}.bubble{max-width:calc(100% - 55px)}}
@supports (scrollbar-gutter:stable){.messages,.history{scrollbar-gutter:stable}}
@media(min-width:761px){.sidebar{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}.history{flex:1}}
@media(max-width:760px){.sidebar{position:fixed;z-index:12;inset:0 auto 0 0;width:min(300px,86vw);height:100vh;height:100dvh;transform:translateX(-105%);box-shadow:none;transition:transform .2s ease}.sidebar.open{transform:translateX(0)}.sidebar-backdrop{position:fixed;z-index:11;inset:0;background:rgba(0,0,0,.38)}.sidebar-backdrop.show{display:block}.mobile-menu{display:grid}.topbar{height:58px;min-height:58px}.chat-page{padding:22px 14px 14px}.welcome{margin:25px auto}.welcome h1{font-size:clamp(27px,8vw,36px)}.suggestions{grid-template-columns:1fr;margin-top:22px}.suggestion{min-height:0}.composer-wrap{padding-top:10px}.subpage{padding:28px 16px 48px}.settings-section{padding:16px}.terms-card{padding:17px}.footer{padding:13px 15px}.top-note{display:none}}
@media(max-width:420px){.footer{flex-direction:column;gap:5px}.setting-row{align-items:flex-start}.select,.text-field{max-width:48%}.message{gap:8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}

<main class="main">
<header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" id="menuBtn" type="button" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button><span class="page-title" id="pageTitle">New chat</span></div><div class="top-actions"><button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Switch to dark theme"><svg class="ico" id="themeIcon" aria-hidden="true"><use href="#i-moon"/></svg></button></div></header>
<div class="content" id="content" tabindex="-1"></div>
<footer class="footer"><span>© 2026 Ozlind. All rights reserved.</span><span><a href="#" data-link="terms">Terms &amp; conditions</a> · <a href="#" data-link="settings">Settings</a></span></footer>
</main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), content=$('#content'), sidebar=$('#sidebar');
let page='chat',messages=[],conversations=[],activeId=0;
const SESSION_KEY='ozlind-session-v1';
function restoreSession(){try{const saved=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');if(saved&&Array.isArray(saved.conversations)){conversations=saved.conversations.slice(0,30);messages=Array.isArray(saved.messages)?saved.messages:[];activeId=Number(saved.activeId)||0;if(activeId&&!conversations.some(c=>c.id===activeId)){activeId=0;messages=[]}}}catch{conversations=[];messages=[];activeId=0}}
function persistSession(){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify({conversations,activeId,messages}))}catch{}}
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)};
function setPage(next){page=next;$('#pageTitle').textContent=next==='chat'?(activeId?(conversations.find(c=>c.id===activeId)?.title.slice(0,36)||'Chat'):'New chat'):next==='settings'?'Settings':'Terms & conditions';document.querySelectorAll('.nav-item[data-page]').forEach(b=>{const active=b.dataset.page===next;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});sidebar.classList.remove('open');$('#sidebarBackdrop').classList.remove('show');$('#menuBtn').setAttribute('aria-expanded','false');render()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(page==='chat')renderChat();else if(page==='settings')renderSettings();else renderTerms()}
function renderChat(){content.innerHTML='<section class="chat-page"><div class="messages" id="messages" role="log" aria-label="Conversation messages" aria-live="polite" aria-relevant="additions"></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Message Ozlind..." aria-label="Message Ozlind" aria-describedby="sendHint"></textarea><div class="composer-tools"><div class="tool-left"></div><div class="tool-right"><span style="font-size:10px;color:var(--muted)" id="sendHint">Enter to send</span><button class="send-btn" id="sendBtn" type="button" aria-label="Send message" disabled><svg class="ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button></div></div></div><p class="disclaimer">AI responses are not connected yet. Messages are kept only in this browser session.</p></div></section>';
const area=$('#messages');if(!messages.length){const showSuggestions=localStorage.getItem('ozlind-suggestions')!=='0';area.innerHTML='<div class="welcome"><h1>What can I help you with?</h1><p>Ask a question or describe what you want to work on.</p>'+(showSuggestions?'<div class="suggestions"><button class="suggestion" data-prompt="Explain a complex topic in simple terms"><strong>Learn something</strong>Make a difficult topic easier to understand.</button><button class="suggestion" data-prompt="Help me draft and improve a piece of writing"><strong>Write with clarity</strong>Draft, edit or explore a new idea.</button><button class="suggestion" data-prompt="Help me plan a project step by step"><strong>Plan a project</strong>Turn a goal into practical next steps.</button><button class="suggestion" data-prompt="Review this code and suggest improvements"><strong>Work with code</strong>Review, understand and improve code.</button></div>':'')+'</div>'}else{messages.forEach(m=>{const el=document.createElement('div');el.className='message '+m.role;el.innerHTML='<div class="message-label">'+(m.role==='user'?'You':'Ozlind')+'</div><div class="bubble">'+escapeHtml(m.text)+'</div>';area.appendChild(el)});area.scrollTop=area.scrollHeight}
const input=$('#prompt'),send=$('#sendBtn'),enterToSend=localStorage.getItem('ozlind-enter-send')!=='0';$('#sendHint').textContent=enterToSend?'Enter to send':'Ctrl + Enter to send';input.addEventListener('input',()=>{send.disabled=!input.value.trim();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&(enterToSend||e.ctrlKey||e.metaKey)){e.preventDefault();sendMessage()}});send.addEventListener('click',sendMessage);document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.dispatchEvent(new Event('input'));input.focus()}));}
function sendMessage(){const input=$('#prompt');if(!input||!input.value.trim())return;const text=input.value.trim();messages.push({role:'user',text});if(!activeId){activeId=Date.now();conversations.unshift({id:activeId,title:text.slice(0,42),messages:messages.slice()})}else{const current=conversations.find(c=>c.id===activeId);if(current)current.messages=messages.slice()}persistSession();renderHistory();$('#pageTitle').textContent=text.slice(0,36);renderChat()}
function renderHistory(){const h=$('#history');h.innerHTML='';if(!conversations.length){h.innerHTML='<div class="empty-history">Your recent chats will show up here.</div>';return}conversations.slice(0,12).forEach(c=>{const b=document.createElement('button');b.className='history-item';b.textContent=c.title;b.title=c.title;b.setAttribute('aria-label','Open chat: '+c.title);b.addEventListener('click',()=>{activeId=c.id;messages=c.messages.slice();persistSession();setPage('chat');$('#pageTitle').textContent=c.title.slice(0,36)});h.appendChild(b)})}
function renderSettings(){content.innerHTML='<section class="subpage"><h1>Settings</h1><p class="lead">Make Ozlind feel right for the way you work.</p><div class="settings-section"><h2>Appearance</h2><p class="section-desc">Choose how Ozlind looks on this device.</p><div class="setting-row"><div><div class="setting-title">Theme</div><div class="setting-help">Switch between pure white and pure black backgrounds.</div></div><select class="select" id="themeSelect"><option value="light">Light</option><option value="dark">Dark</option></select></div></div><div class="settings-section"><h2>Chat preferences</h2><p class="section-desc">Control your conversation experience.</p><div class="setting-row"><div><div class="setting-title">Enter to send</div><div class="setting-help">Press Enter to send; Shift + Enter for a new line.</div></div><input type="checkbox" class="toggle" id="enterToggle" checked></div><div class="setting-row"><div><div class="setting-title">Show prompt suggestions</div><div class="setting-help">Display helpful starting points on a new chat.</div></div><input type="checkbox" class="toggle" id="suggestToggle" checked></div></div><div class="settings-section"><h2>Privacy &amp; data</h2><p class="section-desc">This early interface keeps chat state in this browser session only. Account sync and server-side data controls are not connected.</p><div class="setting-row"><div><div class="setting-title">Clear current conversation</div><div class="setting-help">Remove messages from the open chat.</div></div><button class="secondary-btn" id="clearChat">Clear chat</button></div></div><div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="primary-btn" id="saveSettings">Save preferences</button></div></section>';
$('#themeSelect').value=document.documentElement.dataset.theme||'light';$('#enterToggle').checked=localStorage.getItem('ozlind-enter-send')!=='0';$('#suggestToggle').checked=localStorage.getItem('ozlind-suggestions')!=='0';$('#themeSelect').addEventListener('change',e=>applyTheme(e.target.value));$('#saveSettings').addEventListener('click',()=>{localStorage.setItem('ozlind-enter-send',$('#enterToggle').checked?'1':'0');localStorage.setItem('ozlind-suggestions',$('#suggestToggle').checked?'1':'0');toast('Preferences saved on this device.')});$('#clearChat').addEventListener('click',()=>{if(activeId)conversations=conversations.filter(c=>c.id!==activeId);messages=[];activeId=0;persistSession();renderHistory();setPage('chat');toast('Current conversation cleared.')})}
function renderTerms(){content.innerHTML='<section class="subpage"><h1>Terms &amp; conditions</h1><p class="lead">Please read these terms before using the Ozlind interface.</p><div class="notice">This is a preliminary product terms page for the early Ozlind interface, not a substitute for legally reviewed terms. It must be reviewed and completed by the service operator before public launch.</div><article class="terms-card"><h2>1. Acceptance of terms</h2><p>By accessing or using Ozlind, you agree to comply with the terms and policies that apply to the service. If you do not agree, please do not use the service.</p></article><article class="terms-card"><h2>2. The service</h2><p>Ozlind is being developed as an AI workspace. Features may change, be added, or be temporarily unavailable as the platform evolves. The interface currently shown is an early frontend build; AI responses, accounts, uploads and cloud synchronisation are not yet connected.</p></article><article class="terms-card"><h2>3. Acceptable use</h2><p>You agree not to misuse the service, interfere with its operation, attempt unauthorised access, or use it in ways that violate applicable laws or the rights of others.</p></article><article class="terms-card"><h2>4. AI-generated content</h2><p>AI-generated information may be inaccurate, incomplete or outdated. You are responsible for reviewing outputs and verifying important information before relying on it. Do not treat generated content as professional legal, medical, financial or other regulated advice.</p></article><article class="terms-card"><h2>5. Privacy and data</h2><p>Data handling, retention, security, analytics and account controls must be described in a separate Privacy Policy before public launch. Do not submit sensitive personal information to an early or unverified build.</p></article><article class="terms-card"><h2>6. Availability and changes</h2><p>The service is provided during development on an evolving basis. We may modify, suspend or discontinue features. No uptime or uninterrupted availability is promised by this preliminary page.</p></article><article class="terms-card"><h2>7. Contact and governing law</h2><p>Official operator details, a support contact, governing law and dispute-resolution terms must be added and legally reviewed before these terms are published as binding terms.</p></article><p class="terms-date">Draft interface text · Last updated: 27 November 2026</p></section>'}
function applyTheme(theme){theme=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#000000':'#ffffff';try{localStorage.setItem('ozlind-theme',theme)}catch{}const s=$('#themeSelect');if(s)s.value=theme;const b=$('#themeBtn');if(b){const label=theme==='dark'?'Switch to light theme':'Switch to dark theme';b.setAttribute('aria-label',label);b.title=label;$('#themeIcon').innerHTML='<use href="#i-'+(theme==='dark'?'sun':'moon')+'"/>'}}
$('#newChat').addEventListener('click',()=>{messages=[];activeId=0;persistSession();setPage('chat')});document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.querySelectorAll('[data-link]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();setPage(a.dataset.link)}));$('#themeBtn').addEventListener('click',()=>applyTheme((document.documentElement.dataset.theme||'light')==='light'?'dark':'light'));$('#menuBtn').addEventListener('click',()=>{const open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);$('#sidebarBackdrop').classList.toggle('show',open);$('#menuBtn').setAttribute('aria-expanded',String(open))});$('#sidebarBackdrop').addEventListener('click',()=>{sidebar.classList.remove('open');$('#sidebarBackdrop').classList.remove('show');$('#menuBtn').setAttribute('aria-expanded','false')});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#newChat').click()}if(e.key==='Escape'){sidebar.classList.remove('open');$('#sidebarBackdrop').classList.remove('show');$('#menuBtn').setAttribute('aria-expanded','false')}});let savedTheme='light';try{savedTheme=localStorage.getItem('ozlind-theme')||'light'}catch{}applyTheme(savedTheme);restoreSession();renderHistory();render();
</script>
</body></html>
